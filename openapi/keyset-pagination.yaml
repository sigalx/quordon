          - normalized-requested-page-limit
          - cursor-values-with-deep-copied-raw-payloads
          - filter-values-with-deep-copied-raw-payloads
          - policy-owned-optional-index-plan-bound-and-work-controls
          - identifier-semantics-and-generation
          - effective-limits-and-deadline
        requested-page-limit-binding:
          source: strictly-decoded-query-limit
          shape-signature-member: false
          immutable-token-field: true
          validated-against:
            - policy-shape-maximum-limit
            - effective-max-rows
            - platform-and-limit-plus-one-arithmetic-bound
          compiled-row-bound: normalized-requested-page-limit-plus-one
          raw-request-state-passed-to-manager-or-adapter: forbidden
        manager-and-adapter-input: authorized-token-only
        mutable-aliases: forbidden
      x-quordon-policy-shape:
        config-path: profiles.<profile>.query.keyset_select_shapes[]
        required-public-members:
          - name
          - source
          - projection
          - order_by
          - maximum_limit
        optional-public-members:
          - public_description
          - filter
        optional-execution-only-members:
          - required_index
          - allow_temporary_table
          - allow_filesort
        required-execution-only-members:
          - maximum_rows_examined_per_scan
        complete-signature-binds:
          - source
          - projection-order-fields-and-aliases
          - full-filter-boolean-topology-fields-operators-types-and-arity
          - full-order-fields-and-directions
        excluded-from-signature:
          - filter-values
          - page-cursor-values
          - requested-limit-below-the-policy-maximum
        public-name-comparison: exact-case-sensitive-utf8
        shape-name-and-signature-uniqueness: >-
          Reject startup unless public names are exact-case-sensitive unique
          and every pair of keyset shapes has a disjoint accepted request set.
          Distinct names do not make otherwise identical shapes disjoint: the
          comparison includes normalized source, projection, complete filter
          tree, order, value types and arities, plus the intersecting 1 through
          maximum_limit interval. If one request could match two shapes after
          any supported identifier normalization, the policy is invalid.
        canonical-filter-representation:
          request-and-policy-algorithm: identical
          traversal: single-bottom-up-bounded-pass
          child-order-for-commutative-groups: fixed-length-child-digest-then-canonical-tie-breaker
          digest-input-binds: kind-operator-field-value-types-arity-and-child-digests
          filter-values: excluded
          recursively-embedded-json-text: forbidden
          repeated-subtree-recanonicalization: forbidden
          digest-collision: compare-bounded-canonical-structure-before-match
        yaml-validation:
          unknown-members: forbidden
          merge-keys: forbidden
          explicit-null-for-non-null-members: forbidden
          omitted-required-member: forbidden
          empty-optional-string-is-not-absence: true
          aliases: dereference-before-tag-presence-and-value-validation
          string-members-require-yaml-string-token: true
          integer-members-require-canonical-nonnegative-yaml-integer-token: true
          maximum-limit-range: 1-through-effective-profile-max-rows
          maximum-rows-examined-range: 1-through-uint64-maximum
          identifier-and-array-maxima: same-as-openapi-request
          required-index: optional-portable-identifier-with-1-through-128-ascii-bytes
          public-description: 1-through-512-unicode-scalar-values-without-control-characters
          exact-shape-structural-limits: >-
            Projection count, order/key width, filter depth and predicate
            count must fit the effective hard/profile limits because clients
            cannot remove these members from the named shape.
          after-page-parameter-limit: >-
            Filter bind count plus N*(N+1)/2 cursor binds plus one implicit
            LIMIT bind must fit the effective max_parameters using
            overflow-safe arithmetic. Otherwise the shape cannot paginate and
            startup is rejected.
          predicate-type-rules: >-
            Every in/not_in value_types item uses one identical discriminator;
            like accepts only string or bytes. Violations are independent of
            datasource metadata and reject startup.
          invalid-result: reject-process-startup
        immutable-policy-snapshot:
          deep-copy-all-maps-slices-pointers-and-raw-values: true
          accessors-return-no-mutable-aliases: true
        policy-fingerprint:
          canonical-redacted-policy: true
          includes-public-and-execution-shape-controls: true
          excludes-dsn-credentials-and-secret-values: true
      x-quordon-key-invariants:
        key-source: policy-order-by-and-source-column-metadata
        complete-ordered-tuple-uniqueness: guaranteed-by-policy-author
        unique-index-proof: not-required
        generated-key-column: allowed-if-nonnull-and-supported-type
        nullable-key-column: forbidden
        key-fields-projected-exactly-once: true
        key-field-alias: allowed
        cursor-order: exact-order-by-field-order
        supported-cursor-source-types:
          - signed-or-unsigned-tinyint-smallint-mediumint-int-or-bigint
          - char-or-varchar-with-server-verified-lossless-source-charset-to-utf8-round-trip
          - binary-or-varbinary
          - date
          - datetime-with-source-fsp-zero-through-six
          - timestamp-with-source-fsp-zero-through-six-and-verified-utc-session
        unsupported-cursor-source-types:
