          OpenAPI validates one HTTP message at a time and cannot correlate the
          selected request oneOf branch with the later success-response oneOf
          branch.
        handler-dispatch:
          legacy-request: existing-select-handler-returning-only-SelectResult
          keyset-request: keyset-select-handler-returning-only-KeysetSelectResult
          independently-selecting-a-success-union-branch: forbidden
        required-pairs:
