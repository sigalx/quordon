      allowed: [POST]
      unsupported-method:
        status: 405
        code: METHOD_NOT_ALLOWED
        before-authentication-and-audit: true
        allow-header: POST
      head-exception:
        body: suppressed-by-go-net-http
        stable-code-header: X-Quordon-Error-Code
    post:
      operationId: executeSelect
      summary: Execute a bounded ordinary or policy-curated keyset SELECT
      description: >-
        Additive contract for the existing ordinary SELECT and the implemented
        opt-in branch for reading one bounded page from an
        exact operator-curated single-object SELECT shape, including trusted views. The client selects a
        public shape and supplies only its filter values, page limit, and a
        server-issued typed cursor for subsequent pages. It never selects an
        index, SQL expression, source-work bound, or arbitrary ordering. The
        operation is granted separately from ordinary select because repeated
        keyset requests can enumerate every row exposed by the shape. A page is
        evaluated in one read-only transaction, but separate HTTP requests do
        not share a database snapshot. Concurrent inserts, deletes, or updates
        to filter/order fields can therefore make a multi-page traversal omit
        or revisit logical records; this endpoint is not an export snapshot.
        MySQL requires SHOW VIEW for view plan preflight. SELECT-only datasource
        credentials produce 503 DATABASE_UNAVAILABLE for an authorized view
        before the main SELECT; plan preflight is never skipped.
      x-quordon-status: stable
      x-quordon-capability: select_keyset
      x-quordon-exact-media-type: application/json
      tags: [Queries]
      x-quordon-processing-order:
        - validate-exact-method-and-path
        - authenticate-http-basic-credentials
        - require-application-json-before-reading-the-body
        - apply-hard-body-limit-before-full-read-or-tree-materialization
