      unevaluatedProperties: false

    QueryShapeListResult:
      description: >-
        Complete, deterministically ordered public aggregate shapes from one
        immutable policy snapshot. The list is never partial. Shapes are sorted
        by their case-sensitive public names in ascending UTF-8 byte order and
        names are unique within the profile.
      type: object
      additionalProperties: false
      required: [policy_profile, policy_version, datasource, adapter, shapes]
      properties:
        policy_profile:
          type: string
          minLength: 1
        policy_version:
          type: string
          minLength: 1
        datasource:
          type: string
          minLength: 1
        adapter:
          type: string
          const: mysql8
        shapes:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AggregateQueryShape"
      x-quordon-semantic-validation:
        - Public shape names are unique by exact code-point comparison and sorted by UTF-8 bytes.
        - The 1000-shape protocol maximum is enforced during policy startup validation.
        - Every returned shape passed strict startup validation and preserves the exact public identifier spelling from the policy snapshot.
        - Datasource-dependent identifier canonicalization is deliberately not performed during discovery; a request constructed with the disclosed spelling is normalized only on the aggregate execution path.
        - Returned client-visible query signatures do not overlap; shape names and omitted execution-only controls cannot make an ambiguous policy valid.
        - The complete response must fit the effective max_result_bytes limit; an incompatible policy is rejected before startup readiness.

    QueryShapeListResultV2:
      description: >-
        Complete immutable public shape set for clients that explicitly opt in
        to the time-bucket discriminator. It retains all v1 ordering, policy,
        disclosure, snapshot, and response-budget invariants.
      type: object
      additionalProperties: false
      required: [policy_profile, policy_version, datasource, adapter, shapes]
      properties:
        policy_profile:
          type: string
          minLength: 1
        policy_version:
          type: string
          minLength: 1
        datasource:
          type: string
          minLength: 1
        adapter:
          type: string
          const: mysql8
        shapes:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AggregateQueryShapeV2"

    QueryShapeListResultV3:
      description: >-
        Complete immutable public shape set for clients that explicitly opt in
        to the keyset discriminator. It retains all v2 ordering, policy,
        disclosure, snapshot, and response-budget invariants.
      type: object
      additionalProperties: false
      required: [policy_profile, policy_version, datasource, adapter, shapes]
      properties:
        policy_profile:
          type: string
          minLength: 1
        policy_version:
          type: string
          minLength: 1
        datasource:
          type: string
          minLength: 1
        adapter:
          type: string
          minLength: 1
        shapes:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: "#/components/schemas/QueryShapeV3"

    QueryShapeV3:
      description: Closed operation-discriminated aggregate or keyset construction shape.
      oneOf:
        - $ref: "#/components/schemas/AggregateQueryShapeV2"
        - $ref: "#/components/schemas/KeysetSelectQueryShape"
      discriminator:
        propertyName: operation
        mapping:
          aggregate: "#/components/schemas/AggregateQueryShapeV2"
          select_keyset: "#/components/schemas/KeysetSelectQueryShape"

    KeysetSelectQueryShape:
