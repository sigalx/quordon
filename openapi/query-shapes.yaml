        kind: {type: string, const: group}
        operator: {type: string, enum: [and, or]}
        expressions:
          type: array
          minItems: 2
          maxItems: 200
          uniqueItems: true
          items:
            $ref: "#/components/schemas/KeysetFilterShapeExpression"

    AggregateQueryShapeV2:
      type: object
      additionalProperties: false
