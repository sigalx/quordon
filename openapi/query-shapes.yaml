    AggregateNullFilterShape:
      description: Null-check template with no bind values.
      type: object
      additionalProperties: false
      required: [kind, field, operator, value_types]
      properties:
        kind:
          type: string
          const: predicate
        field:
          $ref: "#/components/schemas/Identifier"
        operator:
          type: string
          enum: [is_null, is_not_null]
        value_types:
          type: array
          maxItems: 0

    AggregateFilterShapeGroup:
      description: Parenthesized AND or OR construction template.
      type: object
      additionalProperties: false
      required: [kind, operator, expressions]
      properties:
        kind:
          type: string
          const: group
        operator:
          type: string
          enum: [and, or]
        expressions:
          type: array
          minItems: 2
          maxItems: 200
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AggregateFilterShapeExpression"

    PortableValueType:
