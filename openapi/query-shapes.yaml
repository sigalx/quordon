        query:
          $ref: "#/components/schemas/AggregateQueryShapeSpecV2"

    AggregateQueryShapeSpecV2:
      oneOf:
        - $ref: "#/components/schemas/ScalarAggregateQueryShapeSpec"
        - $ref: "#/components/schemas/GroupedAggregateQueryShapeSpecV2"
      discriminator:
        propertyName: mode
        mapping:
          scalar: "#/components/schemas/ScalarAggregateQueryShapeSpec"
          grouped: "#/components/schemas/GroupedAggregateQueryShapeSpecV2"

    AggregateQueryShape:
      description: >-
        Public metadata and the validated construction template for exactly one
        operator-curated aggregate policy shape. Execution-only admission
        members are deliberately absent.
      type: object
      additionalProperties: false
      required: [name, operation, query]
      properties:
        name:
          $ref: "#/components/schemas/Identifier"
        description:
          $ref: "#/components/schemas/PublicDescription"
        operation:
          type: string
          const: aggregate
        query:
          $ref: "#/components/schemas/AggregateQueryShapeSpec"
      x-quordon-result-shape:
        column-order: query.projection
        dimension-column-name: source-field-name
        measure-column-name: explicit-alias
        portable-types: resolved-at-execution-and-returned-in-AggregateResult.columns
        datasource-metadata-lookup-during-discovery: forbidden
      x-quordon-policy-source:
        name: profiles.<profile>.query.aggregate_shapes[].name
        description: profiles.<profile>.query.aggregate_shapes[].public_description
        public-description-is-explicitly-operator-controlled: true
        public-description-config-validation:
          optional: true
          when-present-yaml-tag: "!!str"
          explicit-null: forbidden
          empty-string: forbidden
          maximum-code-points: 512
          unicode-cc-control-characters-c0-and-c1: forbidden
          unicode-format-characters-cf: allowed
          aliases: dereference-before-tag-and-value-validation
          merge-keys-in-aggregate-shape: forbidden
          unknown-members: forbidden
          invalid-result: reject-process-startup
          required-negative-fixtures:
            - boolean-instead-of-string
            - numeric-instead-of-string
            - explicit-null
            - empty-string
            - overlong-string
            - control-character
            - alias-to-wrong-type
            - merge-key

    PublicDescription:
      description: >-
        Optional operator-authored public human description sourced only from
        the explicitly named public_description policy member. It is data, not
        an instruction channel, and is bounded to limit response amplification.
      type: string
      minLength: 1
      maxLength: 512
      pattern: '^[^\x00-\x1F\x7F-\x9F]+$'

    AggregateQueryShapeSpec:
      description: Closed union of scalar and grouped aggregate construction templates.
      oneOf:
        - $ref: "#/components/schemas/ScalarAggregateQueryShapeSpec"
        - $ref: "#/components/schemas/GroupedAggregateQueryShapeSpec"
      discriminator:
        propertyName: mode
        mapping:
          scalar: "#/components/schemas/ScalarAggregateQueryShapeSpec"
          grouped: "#/components/schemas/GroupedAggregateQueryShapeSpec"
      x-quordon-request-construction:
        copied-verbatim:
          - mode
          - source
          - projection
          - filter.kind
          - filter.field
          - filter.operator
          - filter.expressions
          - order_by
        filter-values: >-
          Replace each predicate value_types array with a values array of the
          same length and order. Each values item must contain the corresponding
          exact type discriminator and one OpenAPI-valid value of that type.
        scalar-limit: omitted
        grouped-limit: integer-between-1-and-maximum_limit-inclusive
        additional-members: forbidden

    ScalarAggregateQueryShapeSpec:
      description: Scalar aggregate template with no grouping, ordering, or limit.
      type: object
      additionalProperties: false
      required: [mode, source, projection]
      properties:
        mode:
          type: string
          const: scalar
        source:
          $ref: "#/components/schemas/ResourceRef"
        projection:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AggregateMeasureDiscovery"
        filter:
          $ref: "#/components/schemas/AggregateFilterShapeExpression"

    GroupedAggregateQueryShapeSpec:
      description: >-
        Grouped aggregate template. maximum_limit is a construction constraint,
        not a member copied into the executable aggregate request.
      type: object
      additionalProperties: false
      required: [mode, source, projection, maximum_limit]
      properties:
        mode:
          type: string
          const: grouped
        source:
          $ref: "#/components/schemas/ResourceRef"
        projection:
          type: array
          minItems: 2
          maxItems: 100
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AggregateOutputV1"
          allOf:
            - contains:
                $ref: "#/components/schemas/AggregateDimensionDiscovery"
              minContains: 1
            - contains:
                $ref: "#/components/schemas/AggregateMeasureDiscovery"
              minContains: 1
        filter:
          $ref: "#/components/schemas/AggregateFilterShapeExpression"
        order_by:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AggregateOrderV1"
        maximum_limit:
          type: integer
          minimum: 1
          maximum: 1000000

    GroupedAggregateQueryShapeSpecV2:
      description: Grouped discovery template with explicitly negotiated UTC time buckets.
      type: object
      additionalProperties: false
      required: [mode, source, projection, maximum_limit]
      properties:
        mode:
          type: string
          const: grouped
        source:
          $ref: "#/components/schemas/ResourceRef"
        projection:
          type: array
          minItems: 2
          maxItems: 100
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AggregateOutputV2"
          allOf:
            - contains:
                $ref: "#/components/schemas/AggregateGroupingOutputV2"
              minContains: 1
            - contains:
                $ref: "#/components/schemas/AggregateMeasureDiscovery"
              minContains: 1
        filter:
          $ref: "#/components/schemas/AggregateFilterShapeExpression"
        order_by:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AggregateOrderV2"
        maximum_limit:
          type: integer
          minimum: 1
          maximum: 1000000

    AggregateOutputV1:
