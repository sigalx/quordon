name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate workflows and package scripts
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
          shellcheck \
            packaging/scripts/*.sh \
            packaging/tests/mock-bin/* \
            scripts/package-smoke-test.sh \
            scripts/verify-third-party-notices.sh

      - name: Install Vacuum
        run: go install github.com/daveshanley/vacuum@v0.30.0

      - name: Verify source and OpenAPI
        run: make verify

      - name: Run race tests
        run: go test -race ./...

      - name: Run MySQL integration tests
        run: make integration

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --snapshot --clean

      - name: Lint Debian packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes lintian
          make package-lint

      - name: Test Debian package lifecycle
        run: ./scripts/package-smoke-test.sh
