$ref: './policy.integration.yaml'
$override:
  principals:
    integration-client:
      profiles: [query-explainer, data-reader, metadata-reader, analytics, views-reader, admission-reader, index-merge-reader, diagnostic-reader, routing-test, routing-rc, analytics-rc, admission-rc, views-rc]
  datasources:
    integration-mysql:
      $ref: './policy.integration.yaml#/datasources/integration-mysql'
    integration-rc-mysql:
      $ref: './policy.integration.yaml#/datasources/integration-mysql'
