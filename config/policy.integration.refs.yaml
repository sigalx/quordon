$ref: './policy.integration.yaml'
$override:
  principals:
    integration-client:
      profiles: [query-explainer, data-reader, metadata-reader, analytics, views-reader, admission-reader, index-merge-reader, diagnostic-reader, routing, numeric, numeric-byte]
      datasources: [integration-mysql, integration-rc-mysql]
  datasources:
    integration-mysql:
      $ref: './policy.integration.yaml#/datasources/integration-mysql'
    integration-rc-mysql:
      $ref: './policy.integration.yaml#/datasources/integration-mysql'
      $override:
        dsn: "quordon:quordon-password@tcp(mysql-rc:3306)/?parseTime=true&interpolateParams=true&columnsWithAlias=true&collation=latin1_swedish_ci"
  profiles:
    query-explainer:
      $ref: './policy.integration.yaml#/profiles/query-explainer'
      $override:
        datasources: [integration-mysql, integration-rc-mysql]
    data-reader:
      $ref: './policy.integration.yaml#/profiles/data-reader'
      $override:
        datasources: [integration-mysql, integration-rc-mysql]
    metadata-reader:
      $ref: './policy.integration.yaml#/profiles/metadata-reader'
      $override:
        datasources: [integration-mysql, integration-rc-mysql]
    analytics:
      $ref: './policy.integration.yaml#/profiles/analytics'
      $override:
        datasources: [integration-mysql, integration-rc-mysql]
    views-reader:
      $ref: './policy.integration.yaml#/profiles/views-reader'
      $override:
        datasources: [integration-mysql, integration-rc-mysql]
    admission-reader:
      $ref: './policy.integration.yaml#/profiles/admission-reader'
      $override:
        datasources: [integration-mysql, integration-rc-mysql]
    index-merge-reader:
      $ref: './policy.integration.yaml#/profiles/index-merge-reader'
      $override:
        datasources: [integration-mysql, integration-rc-mysql]
    diagnostic-reader:
      $ref: './policy.integration.yaml#/profiles/diagnostic-reader'
      $override:
        datasources: [integration-mysql, integration-rc-mysql]
    routing:
      $ref: './policy.d/integration/routing.yaml'
      $override:
        datasources: [integration-mysql, integration-rc-mysql]
    numeric:
      $ref: './policy.d/integration/numeric-bucket.yaml'
      $override:
        datasources: [integration-mysql, integration-rc-mysql]
    numeric-byte:
      $ref: './policy.d/integration/numeric-bucket.yaml'
      $override:
        operations: [aggregate]
        limits:
          $ref: './policy.d/integration/numeric-bucket.yaml#/limits'
          $override:
            max_result_bytes: 1600
